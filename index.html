<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Gestion de boutique</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>Dashboard</h1>
  <section id="dashboard">
    <p>Bénéfice total : <span id="profit">0</span>€</p>
    <canvas id="profitChart" height="100"></canvas>
  </section>

  <section id="forms">
    <h2>Ajouter un achat</h2>
    <form id="purchase-form">
      <input name="name" placeholder="Article" required />
      <input name="quantity" type="number" placeholder="Quantité" required />
      <input name="cost" type="number" step="0.01" placeholder="Prix d'achat" required />
      <input name="date" type="date" required />
      <button type="submit">Ajouter</button>
    </form>

    <h2>Ajouter une vente</h2>
    <form id="sale-form">
      <input name="name" placeholder="Article" required />
      <input name="quantity" type="number" placeholder="Quantité" required />
      <input name="price" type="number" step="0.01" placeholder="Prix de vente" required />
      <input name="date" type="date" required />
      <button type="submit">Vendre</button>
    </form>

    <h2>Retirer du stock</h2>
    <form id="adjust-form">
      <input name="name" placeholder="Article" required />
      <input name="quantity" type="number" placeholder="Quantité" required />
      <input name="date" type="date" required />
      <button type="submit">Retirer</button>
    </form>
  </section>

  <section id="stock">
    <h2>Stock</h2>
    <table>
      <thead><tr><th>Article</th><th>Quantité</th></tr></thead>
      <tbody id="stock-body"></tbody>
    </table>
  </section>

  <script src="script.js"></script>
</body>
</html>
